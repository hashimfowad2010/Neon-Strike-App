<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STRIKE — FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; cursor: crosshair; }
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #0ff;
    text-shadow: 0 0 8px #0ff;
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 22px; height: 22px; z-index: 11; pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0ff; box-shadow: 0 0 6px #0ff;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  .stat { position: fixed; font-size: 22px; font-weight: bold; letter-spacing: 2px; }
  #health { bottom: 24px; left: 28px; color: #0f8; text-shadow: 0 0 8px #0f8; }
  #ammo   { bottom: 24px; right: 28px; }
  #score  { top: 20px; left: 236px; }
  #wave   { top: 20px; left: 50%; transform: translateX(-50%); font-size: 26px; }
  #hpbar-bg { position: fixed; bottom: 16px; left: 28px; width: 240px; height: 6px; background: #033; }
  #hpbar { height: 100%; width: 100%; background: #0f8; box-shadow: 0 0 10px #0f8; transition: width .15s; }
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(0,0,0,.82);
    color: #0ff; text-align: center;
  }
  #overlay h1 { font-size: 64px; letter-spacing: 8px; text-shadow: 0 0 20px #0ff; margin-bottom: 10px; }
  #overlay p { font-size: 18px; margin: 6px; color: #8ff; }
  #overlay .key { color: #ff0; text-shadow: 0 0 8px #ff0; }
  #startBtn {
    margin-top: 26px; padding: 14px 46px; font-size: 22px; font-family: inherit;
    background: #0ff; color: #012; border: none; cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 0 24px #0ff; border-radius: 4px; pointer-events: auto;
  }
  #startBtn:hover { background: #fff; box-shadow: 0 0 34px #fff; }
  #hitmark { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 40px; color: #f44; opacity: 0; z-index: 11; text-shadow: 0 0 10px #f00; }
  #damage-vignette { position: fixed; inset: 0; z-index: 9; pointer-events: none;
    box-shadow: inset 0 0 200px rgba(255,0,0,0); transition: box-shadow .2s; }
    #minimap-wrap {
  position: fixed; top: 16px; left: 16px; z-index: 12; pointer-events: none;
  width: 200px; height: 200px;
  }
  #minimap {
  width: 200px; height: 200px; border-radius: 50%;
  border: 3px solid #0ff; box-shadow: 0 0 18px #0ff, inset 0 0 20px rgba(0,255,255,.15);
  background: rgba(2, 10, 22, 0.7);
  }
  #minimap-label {
  position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
  color: #0ff; font-family: 'Courier New', monospace; font-size: 13px;
  letter-spacing: 2px; text-shadow: 0 0 6px #0ff; white-space: nowrap;
  }
  #viewmodel {
  position: fixed; bottom: -20px; right: 0; z-index: 8;
  width: 620px; max-width: 55vw; pointer-events: none;
  filter: drop-shadow(0 0 12px rgba(0,255,255,0.25));
  transform-origin: bottom right;
  transition: transform 0.04s ease-out;
  user-select: none;
}
/* sway + recoil states applied via JS */
#viewmodel.recoil { transform: translateY(14px) translateX(6px) rotate(-1.5deg) scale(1.02); }

#muzzleflash {
  position: fixed; z-index: 9; pointer-events: none;
  /* positioned roughly over the gun barrel; tweak to taste */
  bottom: 300px; right: 300px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ffdd66 25%, #ff9500 50%, rgba(255,140,0,0) 70%);
  opacity: 0; transform: scale(0.4);
  transition: opacity 0.04s, transform 0.04s;
}

#scope {
  position: fixed; inset: 0; z-index: 13; pointer-events: none;
  opacity: 0; transition: opacity 0.12s ease;
  display: flex; align-items: center; justify-content: center;
}
#scope.active { opacity: 1; }

/* black vignette that masks the corners, leaving a circular lens */
#scope::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at center,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 32vh,
    rgba(0,0,0,0.98) 34vh,
    #000 100%);
}
/* the lens ring + crosshair */
#scope-lens {
  position: relative; width: 68vh; height: 68vh; border-radius: 50%;
  border: 3px solid rgba(0,255,255,0.5);
  box-shadow: 0 0 25px rgba(0,255,255,0.4), inset 0 0 40px rgba(0,255,255,0.08);
}
/* fine crosshair lines inside the scope */
#scope-lens::before, #scope-lens::after {
  content: ''; position: absolute; background: rgba(0,255,255,0.7);
}
#scope-lens::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
#scope-lens::after  { top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-50%); }

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crosshair"></div>
<!-- MINIMAP -->
<div id="minimap-wrap">
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="minimap-label">CENTER</div>
</div>
<div id="hitmark">✕</div>
<div id="damage-vignette"></div>
<!-- GUN VIEWMODEL -->
<img id="viewmodel"
     src="gun.png"
     alt="weapon">
<div id="muzzleflash"></div>
<!-- SCOPE OVERLAY -->
<div id="scope">
  <div id="scope-lens"></div>
</div>
<div id="hud">
  <div id="score" class="stat">SCORE 0</div>
  <div id="wave" class="stat">WAVE 1</div>
  <div id="health" class="stat">100</div>
  <div id="ammo" class="stat">30 / 90</div>
  <div id="hpbar-bg"><div id="hpbar"></div></div>
</div>
<div id="overlay">
  <h1>NEON STRIKE</h1>
  <p>Survive endless waves of hostile drones in the neon arena.</p>
  <p><span class="key">WASD</span> move &nbsp; <span class="key">MOUSE</span> aim &nbsp; <span class="key">CLICK</span> shoot</p>
  <p><span class="key">SHIFT</span> sprint &nbsp; <span class="key">SPACE</span> jump &nbsp; <span class="key">R</span> reload</p>
  <button id="startBtn">CLICK TO PLAY</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- Core setup ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.018);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);

// ---------- Texture loading ----------
const texLoader = new THREE.TextureLoader();

const FLOOR_URL  = "floor.png";
const WALL_URL   = "wall.png";
const PILLAR_URL = "pillar.png";

function loadTiled(url, repeatX, repeatY){
  const t = texLoader.load(url);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const ENEMY_DRONE_URL  = "drone.png";
const ENEMY_RUSHER_URL = "rusher.png";
const ENEMY_BOSS_URL   = "boss.png";

function loadSprite(url){
  const t = texLoader.load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const enemyTextures = {
  drone:  loadSprite(ENEMY_DRONE_URL),
  rusher: loadSprite(ENEMY_RUSHER_URL),
  boss:   loadSprite(ENEMY_BOSS_URL)
};

// Define enemy type stats
const ENEMY_TYPES = {
  drone:  { hpMul: 1.0, speed: 0.045, size: 3.0,  dmg: 10, score: 100, y: 2.5 },
  rusher: { hpMul: 0.6, speed: 0.085, size: 3.2,  dmg: 8,  score: 120, y: 2.6 },
  boss:   { hpMul: 8.0, speed: 0.028, size: 7.0,  dmg: 30, score: 800, y: 4.0 }
};

// ---------- Lighting ----------
scene.add(new THREE.AmbientLight(0x334466, 0.6));
const moon = new THREE.DirectionalLight(0x88aaff, 0.8);
moon.position.set(30, 60, 20); moon.castShadow = true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left = -60; moon.shadow.camera.right = 60;
moon.shadow.camera.top = 60; moon.shadow.camera.bottom = -60;
scene.add(moon);

// ---------- Arena ----------
const ARENA = 80;
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA*2, ARENA*2),
  new THREE.MeshStandardMaterial({
    map: loadTiled(FLOOR_URL, ARENA/4, ARENA/4),   // tiles across the arena
    roughness: 0.7, metalness: 0.4
  })
);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

// Walls
const wallTex = loadTiled(WALL_URL, ARENA/6, 1.5);   // wide tiling along wall length
const wallMat = new THREE.MeshStandardMaterial({
  map: wallTex,
  emissive: 0x0044aa, emissiveIntensity: 0.25,
  roughness: 0.5, metalness: 0.5
});
const wallGeo = new THREE.BoxGeometry(ARENA*2, 12, 1);
const wallDefs = [[0,-ARENA,0],[0,ARENA,0],[-ARENA,0,Math.PI/2],[ARENA,0,Math.PI/2]];
wallDefs.forEach(([x,z,ry])=>{
  const w = new THREE.Mesh(wallGeo, wallMat);
  w.position.set(x,6,z); w.rotation.y = ry; w.castShadow = w.receiveShadow = true;
  scene.add(w);
});

// Cover pillars
const obstacles = [];
for(let i=0;i<14;i++){
  const s = 3 + Math.random()*3;
  const pillarTex = loadTiled(PILLAR_URL, 1, Math.max(1, Math.round(s/1.5)));  // repeats vertically with height
  const p = new THREE.Mesh(
    new THREE.BoxGeometry(s, s*2, s),
    new THREE.MeshStandardMaterial({
      map: pillarTex,
      emissive: 0xff00aa, emissiveIntensity: 0.15,
      roughness: 0.6, metalness: 0.4
    })
  );
  let px, pz;
  do { px = (Math.random()-0.5)*ARENA*1.6; pz = (Math.random()-0.5)*ARENA*1.6; }
  while(Math.hypot(px,pz) < 12);
  p.position.set(px, s, pz); p.castShadow = p.receiveShadow = true;
  p.userData.half = s/2;
  scene.add(p); obstacles.push(p);
}

// ---------- Player / weapon viewmodel ----------
const player = {
  height: 3, pos: new THREE.Vector3(0, 3, 0), vel: new THREE.Vector3(),
  onGround: true, yaw: 0, pitch: 0, hp: 100, score: 0,
  ammo: 30, mag: 30, reserve: 90, reloading: false
};

// ---------- Scope / ADS ----------
const scopeEl = document.getElementById('scope');
let scoped = false;
const FOV_NORMAL = 75;
const FOV_SCOPED = 35;      // lower FOV = zoomed in
let mouseSensNormal = 0.0022;
let mouseSensScoped = 0.0010;  // slower turn while scoped for precision
let currentSens = mouseSensNormal;

function toggleScope(){
  scoped = !scoped;
  if(scoped){
    scopeEl.classList.add('active');
    viewmodel.style.display = 'none';      // hide gun while scoped
  } else {
    scopeEl.classList.remove('active');
    viewmodel.style.display = '';          // show gun again
  }
}

const gun = new THREE.Group();
const gunBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.35, 0.35, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.9, roughness: 0.3 })
);
const gunBarrel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08,0.08,1,12),
  new THREE.MeshStandardMaterial({ color: 0x0ff, emissive: 0x00ffff, emissiveIntensity: 0.8 })
);
gunBarrel.rotation.x = Math.PI/2; gunBarrel.position.set(0,0,-1);
gun.add(gunBody, gunBarrel);
gun.position.set(0.5, -0.5, -1.2);
//camera.add(gun);
scene.add(camera);
const muzzle = new THREE.PointLight(0xffaa00, 0, 10);
muzzle.position.set(0,0,-2); gun.add(muzzle);

//Enemies
const enemies = [];
function spawnEnemy(baseHp, type = 'drone') {
  const cfg = ENEMY_TYPES[type];
  const mat = new THREE.SpriteMaterial({
    map: enemyTextures[type],
    transparent: true,
    depthWrite: false
  });
  const m = new THREE.Sprite(mat);
  m.scale.set(cfg.size, cfg.size, 1);

  const ang = Math.random()*Math.PI*2, r = 40 + Math.random()*25;
  m.position.set(Math.cos(ang)*r, cfg.y, Math.sin(ang)*r);

  // glow light matching the enemy
  const glowColor = (type === 'boss') ? 0xff6600 : 0xff0033;
  const core = new THREE.PointLight(glowColor, type==='boss'?2.5:1.2, type==='boss'?16:8);
  core.position.y = 0; m.add(core);

  const hp = baseHp * cfg.hpMul;
  m.userData = {
    type, hp, maxHp: hp,
    speed: cfg.speed, dmg: cfg.dmg, score: cfg.score,
    baseY: cfg.y, cool: 0, bobPhase: Math.random()*Math.PI*2
  };
  scene.add(m); enemies.push(m);
}

// ---------- Bullets (raycast + tracer) ----------
const raycaster = new THREE.Raycaster();
const tracers = [];
function shoot() {
  if(player.reloading || player.mag <= 0) { if(player.mag<=0) reload(); return; }
  player.mag--; updateHUD();
  muzzle.intensity = 3; setTimeout(()=>muzzle.intensity=0, 60);
  function shoot() {
  if(player.reloading || player.mag <= 0) { if(player.mag<=0) reload(); return; }
  player.mag--; updateHUD();
  gunKick();                    // <-- new: image recoil + muzzle flash

  // ... keep the rest of your raycast/tracer code exactly the same ...
}

  raycaster.setFromCamera({x:0,y:0}, camera);
  const hits = raycaster.intersectObjects([...enemies, ...obstacles], false);
  const origin = new THREE.Vector3(); camera.getWorldPosition(origin);
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  let end = origin.clone().add(dir.clone().multiplyScalar(200));

  if(hits.length){
    end = hits[0].point.clone();
    const obj = hits[0].object;
    if(enemies.includes(obj)){
      obj.userData.hp -= 34;
      showHitmark();
      // flash white/red tint on hit (sprites use .color, not emissiveIntensity)
      obj.material.color.set(0xffcccc);
      setTimeout(()=>{ if(obj.material) obj.material.color.set(0xffffff); }, 80);
      if(obj.userData.hp <= 0) killEnemy(obj);
    }
  }
  // tracer
  const g = new THREE.BufferGeometry().setFromPoints([origin, end]);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x00ffff, transparent:true, opacity:0.9 }));
  scene.add(line); tracers.push({ line, life: 6 });
}

function killEnemy(e){
  player.score += e.userData.score || 100;
  const isBoss = e.userData.type === 'boss';
  // explosion particles
  for(let i=0;i<(isBoss?30:12);i++){
    const p = new THREE.Mesh(new THREE.SphereGeometry(isBoss?0.3:0.15,6,6),
      new THREE.MeshBasicMaterial({ color: isBoss?0xff6600:0xff5500 }));
    p.position.copy(e.position);
    p.userData.v = new THREE.Vector3((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5);
    p.userData.life = 20; scene.add(p); particles.push(p);
  }
  scene.remove(e); enemies.splice(enemies.indexOf(e),1);
  updateHUD();
}
const particles = [];

function reload(){
  if(player.reloading || player.mag === 30) return;   // no reserve check anymore
  player.reloading = true;
  document.getElementById('ammo').textContent = 'RELOADING...';
  setTimeout(()=>{
    player.mag = 30;              // always refill full — unlimited reserve
    player.reloading = false;
    updateHUD();
  }, 900);
}

// ---------- Waves ----------
let wave = 0, enemiesLeft = 0;
function startWave(){
  wave++;
  document.getElementById('wave').textContent = 'WAVE ' + wave;
  const baseHp = 100 + wave*15;

  // Boss every 5 waves
  if(wave % 5 === 0){
    setTimeout(()=> spawnEnemy(baseHp, 'boss'), 400);
  }

  const droneCount  = 3 + wave;
  const rusherCount = Math.floor(wave * 1.5);

  for(let i=0;i<droneCount;i++)
    setTimeout(()=> spawnEnemy(baseHp, 'drone'), i*500);
  for(let i=0;i<rusherCount;i++)
    setTimeout(()=> spawnEnemy(baseHp, 'rusher'), 1500 + i*400);
}

// ---------- HUD ----------
function updateHUD(){
  document.getElementById('score').textContent = 'SCORE ' + player.score;
  document.getElementById('health').textContent = Math.max(0,Math.ceil(player.hp));
  document.getElementById('hpbar').style.width = Math.max(0,player.hp) + '%';
  if(!player.reloading)
    document.getElementById('ammo').textContent = player.mag + ' / ∞';   // unlimited
}
function showHitmark(){
  const h = document.getElementById('hitmark');
  h.style.opacity = 1; setTimeout(()=>h.style.opacity=0, 120);
}
function damageFlash(){
  const v = document.getElementById('damage-vignette');
  v.style.boxShadow = 'inset 0 0 200px rgba(255,0,0,0.7)';
  setTimeout(()=>v.style.boxShadow='inset 0 0 200px rgba(255,0,0,0)', 200);
}
// ---------- MINIMAP ----------
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
const MINI_SIZE = 200;
const MINI_R = MINI_SIZE / 2;           // radius in pixels
// world half-extent (ARENA) maps to the minimap radius
const MINI_SCALE = MINI_R / ARENA;      // pixels per world-unit

function drawMinimap(){
  const ctx = miniCtx;
  ctx.clearRect(0, 0, MINI_SIZE, MINI_SIZE);

  // clip everything to a circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(MINI_R, MINI_R, MINI_R, 0, Math.PI * 2);
  ctx.clip();

  // background
  ctx.fillStyle = 'rgba(2,10,22,0.7)';
  ctx.fillRect(0, 0, MINI_SIZE, MINI_SIZE);

  // grid lines
  ctx.strokeStyle = 'rgba(0,255,255,0.15)';
  ctx.lineWidth = 1;
  for(let i = -ARENA; i <= ARENA; i += 20){
    const p = MINI_R + i * MINI_SCALE;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, MINI_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(MINI_SIZE, p); ctx.stroke();
  }

  // arena boundary square (so you can see the edges)
  ctx.strokeStyle = 'rgba(0,255,255,0.5)';
  ctx.lineWidth = 2;
  const b = ARENA * MINI_SCALE;
  ctx.strokeRect(MINI_R - b, MINI_R - b, b * 2, b * 2);

  // obstacles (dim squares)
  ctx.fillStyle = 'rgba(255,0,170,0.5)';
  for(const o of obstacles){
    const mx = MINI_R + o.position.x * MINI_SCALE;
    const my = MINI_R + o.position.z * MINI_SCALE;
    const s = Math.max(2, o.userData.half * MINI_SCALE);
    ctx.fillRect(mx - s/2, my - s/2, s, s);
  }

  // enemies (red dots)
  ctx.fillStyle = '#ff2244';
  ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 6;
  for(const e of enemies){
    const mx = MINI_R + e.position.x * MINI_SCALE;
    const my = MINI_R + e.position.z * MINI_SCALE;
    ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // player facing cone
  const px = MINI_R + player.pos.x * MINI_SCALE;
  const py = MINI_R + player.pos.z * MINI_SCALE;
  // yaw: forward is (-sin, -cos) in world; on map z maps to y
  const fx = -Math.sin(player.yaw);
  const fz = -Math.cos(player.yaw);
  const ang = Math.atan2(fz, fx);
  const cone = 0.5, len = 22;
  ctx.fillStyle = 'rgba(0,180,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.arc(px, py, len, ang - cone, ang + cone);
  ctx.closePath(); ctx.fill();

  // player (blue dot)
  ctx.fillStyle = '#00baff';
  ctx.shadowColor = '#00baff'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();

  // ----- edge vs center label -----
  const distFromCenter = Math.hypot(player.pos.x, player.pos.z);
  const ratio = distFromCenter / ARENA;   // 0 = dead center, 1 = at wall
  const label = document.getElementById('minimap-label');
  if(ratio < 0.33){
    label.textContent = 'CENTER';  label.style.color = '#0ff';
  } else if(ratio < 0.7){
    label.textContent = 'MID-FIELD'; label.style.color = '#ff0';
  } else {
    label.textContent = '⚠ NEAR EDGE'; label.style.color = '#f44';
  }
  label.style.textShadow = `0 0 6px ${label.style.color}`;
}

// ---------- Input ----------
const keys = {};
addEventListener('keyup',   e => { keys[e.code] = false; });
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code==='KeyR') reload();
  if(e.code==='KeyX') toggleScope();   // ← add this
});

let running = false;
const overlay = document.getElementById('overlay');
document.getElementById('startBtn').addEventListener('click', ()=> canvas.requestPointerLock());

document.addEventListener('pointerlockchange', ()=>{
  if(document.pointerLockElement === canvas){
    running = true; overlay.style.display = 'none';
    if(wave === 0) startWave();
  } else { running = false; if(player.hp>0){ overlay.style.display='flex'; } }
});

addEventListener('mousemove', e => {
  if(!running) return;
  player.yaw   -= e.movementX * currentSens;
  player.pitch -= e.movementY * currentSens;
  player.pitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, player.pitch));
});
addEventListener('mousedown', ()=>{ if(running) shootHeld = true; });
addEventListener('mouseup',   ()=>{ shootHeld = false; });
let shootHeld = false, fireCooldown = 0;

// ---------- Collision helper ----------
function collide(np){
  for(const o of obstacles){
    const h = o.userData.half + 0.6;
    if(Math.abs(np.x - o.position.x) < h && Math.abs(np.z - o.position.z) < h) return true;
  }
  const lim = ARENA - 1.5;
  if(Math.abs(np.x) > lim || Math.abs(np.z) > lim) return true;
  return false;
}

// ---------- Game loop ----------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(running && player.hp > 0){
    // Movement
    const speed = (keys['ShiftLeft'] ? 26 : 15) * dt;
    const fwd = new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
    const move = new THREE.Vector3();
    if(keys['KeyW']) move.add(fwd);
    if(keys['KeyS']) move.sub(fwd);
    if(keys['KeyD']) move.add(right);
    if(keys['KeyA']) move.sub(right);
    if(move.lengthSq()>0) move.normalize().multiplyScalar(speed);

    const nx = player.pos.clone(); nx.x += move.x;
    if(!collide(nx)) player.pos.x = nx.x;
    const nz = player.pos.clone(); nz.z += move.z;
    if(!collide(nz)) player.pos.z = nz.z;

    // Jump / gravity
    if(keys['Space'] && player.onGround){ player.vel.y = 9; player.onGround = false; }
    player.vel.y -= 25 * dt;
    player.pos.y += player.vel.y * dt;
    if(player.pos.y <= player.height){ player.pos.y = player.height; player.vel.y = 0; player.onGround = true; }

    // Camera transform
    camera.position.copy(player.pos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    // Shooting (auto-fire)
    fireCooldown -= dt;
    if(shootHeld && fireCooldown <= 0){ shoot(); fireCooldown = 0.1; }
    // Recoil recovery
    gun.position.z += (-1.2 - gun.position.z) * 0.2;

    // Enemies AI
    for(const e of enemies){
      const ud = e.userData;
      const toP = player.pos.clone().sub(e.position); toP.y = 0;
      const dist = toP.length();
      e.position.add(toP.normalize().multiplyScalar(ud.speed * dt * 60));

      // floating bob animation
      ud.bobPhase += dt * 3;
      e.position.y = ud.baseY + Math.sin(ud.bobPhase) * 0.4;

      ud.cool -= dt;
      const reach = (ud.type === 'boss') ? 6 : 3;
      if(dist < reach && ud.cool <= 0){
        player.hp -= ud.dmg; ud.cool = 1; damageFlash(); updateHUD();
        if(player.hp <= 0) gameOver();
      }
    }

    // Smooth FOV zoom for scope
    const targetFov = scoped ? FOV_SCOPED : FOV_NORMAL;
    camera.fov += (targetFov - camera.fov) * 0.2;
    camera.updateProjectionMatrix();

    // adjust look sensitivity based on scope state
    currentSens = scoped ? mouseSensScoped : mouseSensNormal;

    // Next wave
    if(enemies.length === 0) startWave();

    // Tracers fade
    for(let i=tracers.length-1;i>=0;i--){
      tracers[i].life--; tracers[i].line.material.opacity = tracers[i].life/6;
      if(tracers[i].life<=0){ scene.remove(tracers[i].line); tracers.splice(i,1); }
    }
    // Particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i]; p.position.add(p.userData.v); p.userData.life--;
      p.scale.multiplyScalar(0.92);
      if(p.userData.life<=0){ scene.remove(p); particles.splice(i,1); }
    }
    drawMinimap();
    drawMinimap();
    // weapon sway based on movement + time
    const t = performance.now() * 0.005;
    const moving = (keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']);
    const swayX = Math.sin(t) * (moving ? 8 : 3);
    const swayY = Math.abs(Math.cos(t)) * (moving ? 10 : 3);
    if(!viewmodel.classList.contains('recoil')){
      viewmodel.style.transform = `translate(${swayX}px, ${swayY}px)`;
    }
  }
  renderer.render(scene, camera);
}
animate();

function gameOver(){
  running = false;
  document.exitPointerLock();
  overlay.innerHTML = `<h1 style="color:#f44;text-shadow:0 0 20px #f00">GAME OVER</h1>
    <p>You reached <span class="key">WAVE ${wave}</span></p>
    <p>Final Score: <span class="key">${player.score}</span></p>
    <button id="startBtn">PLAY AGAIN</button>`;
  overlay.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', ()=> location.reload());
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
updateHUD();

// ---------- Viewmodel recoil + muzzle flash ----------
const viewmodel = document.getElementById('viewmodel');
const muzzleflash = document.getElementById('muzzleflash');

function gunKick(){
  // recoil
  viewmodel.classList.add('recoil');
  setTimeout(()=> viewmodel.classList.remove('recoil'), 60);

  // muzzle flash pop
  muzzleflash.style.opacity = '1';
  muzzleflash.style.transform = 'scale(' + (0.8 + Math.random()*0.5) + ') rotate(' + (Math.random()*360) + 'deg)';
  setTimeout(()=>{
    muzzleflash.style.opacity = '0';
    muzzleflash.style.transform = 'scale(0.4)';
  }, 55);
}

</script>
